<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ronja Søvik Solberg</title>
  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
      background-color: #f7f1eb;
      color: #1d140c;
      line-height: 1.2;
    }

    h1 {
      margin-top: 40px;
      margin-bottom: 60px;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      margin: 60px auto;
      gap: 60px;
    }

    .bio, .contact {
      width: 200px;
      text-align: left;
      font-size: 14px;
    }

    .profile-pic {
  width: 300px;
  height: 300px;
  object-fit: cover;
  border-radius: 10px;
    }

    .section {
      margin: 60px 0;
    }

    table {
      margin: 0 auto;
      border-collapse: collapse;
      text-align: center;
    }

    td {
      padding: 10px 20px;
    }

    img {
      width: 200px;
      height: 150px;
      object-fit: cover;
      border-radius: 12px;
    }

    caption {
      caption-side: top;
      font-weight: bold;
      margin-bottom: 10px;
      font-size: 1.2em;
    }
  </style>
</head>
<body>

  <h1>Ronja Søvik Solberg</h1>

  <div class="container">
    <div class="bio">
      <p>Jeg heter Ronja og er 29 år.</p>
      <p>Jeg studerer informasjonsteknologi på HVL. På fritiden liker jeg å trene, gjøre noe kreativt, være med venner og reise. </p>
    </div>

    <img src="images/ronja/ronja.JPG" alt="Profilbilde av Ronja" class="profile-pic">

    <div class="contact">
      <p><strong>Email:</strong><br> ronjasolberg@regnbyen.no</p>
      <p><strong>Tlf:</strong><br> 12345678</p>
    </div>
  </div>

  <div class="section">
    <table>
      <caption>Toppliste reisedestinasjoner</caption>
      <tr>
        <td>
          <img src="images/ronja/mexico.jpg" alt="Mexico">
          <p>Mexico</p>
        </td>
        <td>
          <img src="images/ronja/sydney.jpg" alt="Sydney">
          <p>Sydney</p>
        </td>
        <td>
          <img src="images/ronja/vietnam.jpg" alt="Vietnam">
          <p>Vietnam</p>
        </td>
        <td>
          <img src="images/ronja/zansibar.jpg" alt="Zansibar">
          <p>Zansibar</p>
        </td>
      </tr>
    </table>
  </div>

</body>
</html>
